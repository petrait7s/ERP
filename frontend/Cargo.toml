[package]
name = "weft-web"
version = "1.0.0"
edition = "2021"
description = "WEFT ERP web application (Leptos, compiled to WebAssembly)"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
gloo-storage = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement", "KeyboardEvent", "Storage", "Location", "History", "MediaQueryList", "Blob", "Url", "HtmlAnchorElement", "BlobPropertyBag", "CssStyleDeclaration", "DomTokenList"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
