name: Client demo (Windows installer + Linux AppImage)

# Builds a one-click demo that needs no installation of PostgreSQL, Rust or anything else:
#   WEFT-ERP-Demo-Setup.exe        Windows installer      (also WEFT-ERP-Demo-windows-portable.zip)
#   WEFT-ERP-Demo-x86_64.AppImage  Linux, runs on most distributions
# Both contain the web app, the API, a private PostgreSQL and a sample Bangladesh importer company.
# All data is mock data produced by backend/scripts/seed_demo.py.
#
# Run it:  Actions tab -> "Client demo" -> Run workflow.  Push a tag like v1.0.0 to also publish a Release.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [claude/eloquent-keller-no6lrh, main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # 1. Build the web app and the sample database once; both platforms reuse them.
  assets:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            backend
            frontend
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Build web app
        working-directory: frontend
        run: trunk build --release
      - name: Build API
        working-directory: backend
        run: cargo build --release
      - name: Load sample company through the API
        env:
          DATABASE_URL: postgres://erp:erp@127.0.0.1:5432/erp
          JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
          BIND_ADDR: 127.0.0.1:8080
          RUN_JOBS: "0"
        run: |
          backend/target/release/weft-erp > server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && break; sleep 1; done
          python3 backend/scripts/seed_demo.py http://127.0.0.1:8080
          kill %1 || true
      - name: Dump sample database
        run: |
          mkdir -p assets
          PGPASSWORD=erp /usr/lib/postgresql/16/bin/pg_dump -h 127.0.0.1 -U erp -d erp \
            --no-owner --no-privileges --no-comments -f assets/demo.sql
          # newer pg_dump adds \restrict meta-commands that the bundled (older) psql rejects
          sed -i '/^\\restrict /d;/^\\unrestrict /d' assets/demo.sql
          ls -la assets/demo.sql
          cp -r frontend/dist assets/web
      - uses: actions/upload-artifact@v4
        with:
          name: demo-assets
          path: assets
          retention-days: 3

  # 2. Fetch PostgreSQL binaries (once per platform) and build the launcher + package.
  linux:
    needs: assets
    runs-on: ubuntu-24.04 # the bundled PostgreSQL needs glibc 2.36 or newer
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: demo
      - uses: actions/download-artifact@v4
        with:
          name: demo-assets
          path: assets
      - name: Fetch PostgreSQL 16 binaries
        run: |
          V=16.9.0
          curl -fSL --retry 5 --retry-delay 3 -o pg.tar.gz "https://github.com/theseus-rs/postgresql-binaries/releases/download/$V/postgresql-$V-x86_64-unknown-linux-gnu.tar.gz"
          mkdir pgsrc && tar -xzf pg.tar.gz -C pgsrc --strip-components=1
          test -x pgsrc/bin/initdb
      - name: Build launcher
        working-directory: demo
        run: cargo build --release
      - name: Assemble AppDir
        run: |
          A=AppDir
          mkdir -p $A/usr/bin $A/usr/share/weft
          cp demo/target/release/WEFT-ERP-Demo $A/usr/bin/
          cp -r pgsrc $A/usr/share/weft/pg
          # Bundle every shared library PostgreSQL needs except the C library itself (found by ldd), so the
          # AppImage does not depend on the host's OpenSSL/ICU/XML versions (Fedora differs from Ubuntu).
          PGLIB=$A/usr/share/weft/pg/lib
          for f in $PGLIB/../bin/* $PGLIB/*.so; do
            ldd "$f" 2>/dev/null | awk '/=> \// {print $3}'
          done | sort -u | grep -Ev '/(libc|libm|libdl|libpthread|librt|libresolv|libutil|libnsl|ld-linux[^/]*)\.so' | while read -r l; do
            [ -e "$PGLIB/$(basename "$l")" ] || cp "$(readlink -f "$l")" "$PGLIB/$(basename "$l")"
          done
          ls $PGLIB | grep -E 'libssl|libcrypto|libicu|libxml2|libstdc' 
          cp -r assets/web $A/usr/share/weft/web
          cp assets/demo.sql $A/usr/share/weft/demo.sql
          cp demo/packaging/AppRun $A/AppRun
          cp demo/packaging/weft-erp-demo.desktop $A/
          python3 demo/packaging/make_icon.py $A/weft-erp-demo.png
      - name: Build AppImage
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          mkdir -p out
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir out/WEFT-ERP-Demo-x86_64.AppImage
      - name: Smoke test (starts the AppImage, signs in, loads a screen)
        run: |
          chmod +x out/WEFT-ERP-Demo-x86_64.AppImage
          export WEFT_NO_BROWSER=1 WEFT_VERBOSE=1 HOME=$RUNNER_TEMP/home; mkdir -p $HOME
          out/WEFT-ERP-Demo-x86_64.AppImage --appimage-extract-and-run > run.log 2>&1 &
          for i in $(seq 1 120); do curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && break; sleep 1; done
          cat run.log; tail -30 $HOME/.local/share/WEFT-ERP-Demo/postgres.log || true
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:8080/api/v1/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"owner@petra.example","password":"Demo@12345"}' | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d.get("data",d).get("access_token",""))')
          test -n "$TOKEN"
          curl -fsS http://127.0.0.1:8080/ | grep -qi "WEFT"
          pkill -TERM -f WEFT-ERP-Demo || true
          sleep 3
      - uses: actions/upload-artifact@v4
        with:
          name: WEFT-ERP-Demo-linux-AppImage
          path: out/WEFT-ERP-Demo-x86_64.AppImage

  windows:
    needs: assets
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: demo
      - uses: actions/download-artifact@v4
        with:
          name: demo-assets
          path: assets
      - name: Fetch PostgreSQL 16 binaries
        run: |
          V=16.9.0
          curl -fSL --retry 5 --retry-delay 3 -o pg.zip "https://github.com/theseus-rs/postgresql-binaries/releases/download/$V/postgresql-$V-x86_64-pc-windows-msvc.zip"
          7z x pg.zip -opgtmp -y > /dev/null
          mkdir pgsrc && mv pgtmp/postgresql-$V-x86_64-pc-windows-msvc/* pgsrc/
          test -f pgsrc/bin/initdb.exe
      - name: Build launcher
        working-directory: demo
        run: cargo build --release
      - name: Stage files
        run: |
          mkdir -p stage
          cp demo/target/release/WEFT-ERP-Demo.exe stage/
          cp -r pgsrc stage/pg
          cp -r assets/web stage/web
          cp assets/demo.sql stage/demo.sql
          printf 'WEFT ERP demo\r\n\r\nDouble-click WEFT-ERP-Demo.exe. Your browser opens the app.\r\nSign in: owner@petra.example / Demo@12345\r\nClose the black window to stop. Run with --reset to restore the sample data.\r\n' > stage/READ-ME.txt
      - name: Probe bundled PostgreSQL (initdb, 90 s limit)
        run: |
          timeout 90 stage/pg/bin/initdb.exe -D "$RUNNER_TEMP/probe" -U postgres --auth=trust -E UTF8 --locale=C 2>&1 | tail -25 || echo "initdb probe exit: $?"
          ls "$RUNNER_TEMP/probe" 2>&1 | head -5
          rm -rf "$RUNNER_TEMP/probe"
      - name: Smoke test (starts the program, signs in)
        run: |
          export WEFT_NO_BROWSER=1 WEFT_VERBOSE=1
          stage/WEFT-ERP-Demo.exe > run.log 2>&1 &
          for i in $(seq 1 120); do curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && break; sleep 1; done
          cat run.log; tail -30 "$LOCALAPPDATA/WEFT-ERP-Demo/postgres.log" || true; tasklist | grep -i -E 'WEFT|postgres|initdb' || true
          curl -fsS -X POST http://127.0.0.1:8080/api/v1/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"owner@petra.example","password":"Demo@12345"}' | grep -q access_token
          taskkill //F //IM WEFT-ERP-Demo.exe || true
          stage/pg/bin/pg_ctl.exe -D "$LOCALAPPDATA/WEFT-ERP-Demo/pgdata" -m immediate stop || true
          rm -rf "$LOCALAPPDATA/WEFT-ERP-Demo"
      - name: Portable zip
        run: |
          mkdir -p out
          (cd stage && 7z a -tzip -mx=5 ../out/WEFT-ERP-Demo-windows-portable.zip . > /dev/null)
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "demo\packaging\weft-demo.iss"
      - uses: actions/upload-artifact@v4
        with:
          name: WEFT-ERP-Demo-windows
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dl/*
          generate_release_notes: true
