<!doctype html>
<html lang="en" data-theme="dark" data-density="standard">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WEFT Atelier — ERP overview demo</title>
<style>
:root{--bg:oklch(.165 .012 265);--bg2:oklch(.2 .013 265);--pan:oklch(.235 .014 265);--pan2:oklch(.27 .015 265);--line:oklch(.33 .015 265);--tx:oklch(.96 .005 265);--mut:oklch(.74 .012 265);--dim:oklch(.58 .012 265);--acc:oklch(.74 .16 285);--acc2:oklch(.84 .11 285);--accbg:oklch(.74 .16 285/.14);--ok:oklch(.8 .16 155);--warn:oklch(.83 .15 80);--bad:oklch(.72 .19 25);--r:14px;--pad:16px;--gap:14px;--fs:14px;--shadow:0 18px 50px oklch(0 0 0/.4);--glass:oklch(.235 .014 265/.74);--aura:oklch(.74 .16 285/.13)}
[data-theme=light]{--bg:oklch(.975 .004 265);--bg2:oklch(.955 .005 265);--pan:oklch(1 0 0);--pan2:oklch(.968 .005 265);--line:oklch(.9 .008 265);--tx:oklch(.22 .02 265);--mut:oklch(.45 .02 265);--dim:oklch(.6 .015 265);--acc:oklch(.52 .2 285);--acc2:oklch(.45 .2 285);--accbg:oklch(.52 .2 285/.09);--ok:oklch(.55 .15 155);--warn:oklch(.62 .15 70);--bad:oklch(.55 .2 25);--shadow:0 14px 36px oklch(.3 .02 265/.16);--glass:oklch(1 0 0/.78);--aura:oklch(.7 .15 285/.12)}
[data-density=calm]{--pad:22px;--gap:20px;--fs:15px}
[data-density=dense]{--pad:10px;--gap:9px;--fs:12.5px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 600px at 85% -10%,var(--aura),transparent 60%),radial-gradient(900px 500px at -10% 110%,oklch(.74 .12 180/.08),transparent 60%),var(--bg);color:var(--tx);font:var(--fs)/1.45 ui-sans-serif,Inter,"Segoe UI",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num,.mono,td.n{font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"JetBrains Mono",SFMono-Regular,Menlo,monospace}
.shell{display:grid;grid-template-columns:68px 1fr;grid-template-rows:58px 1fr;height:100vh}
/* rail */
.rail{grid-row:1/3;border-right:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px;z-index:5}
.logo{width:38px;height:38px;margin-bottom:10px}
.rb{position:relative;width:46px;height:46px;border-radius:13px;border:0;background:transparent;color:var(--mut);display:grid;place-items:center;transition:.18s}
.rb svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rb:hover{background:var(--pan2);color:var(--tx)}
.rb.on{background:var(--accbg);color:var(--acc2);box-shadow:inset 0 0 0 1px var(--acc)}
.rb.rec::after{content:"";position:absolute;top:8px;right:8px;width:6px;height:6px;border-radius:9px;background:var(--acc)}
.rb .tip{position:absolute;left:56px;white-space:nowrap;background:var(--pan2);border:1px solid var(--line);padding:3px 9px;border-radius:8px;font-size:12px;color:var(--tx);opacity:0;pointer-events:none;transform:translateX(-4px);transition:.15s;z-index:20;box-shadow:var(--shadow)}
.rb:hover .tip{opacity:1;transform:none}
/* top */
.top{display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);z-index:4}
.crumb{font-weight:650;font-size:1.05em;letter-spacing:.01em;white-space:nowrap}
.crumb small{color:var(--dim);font-weight:500;margin-left:8px}
.cmd{flex:1;max-width:520px;margin:0 auto;display:flex;align-items:center;gap:10px;height:38px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--pan);color:var(--dim);text-align:left;transition:.15s}
.cmd:hover{border-color:var(--acc);color:var(--mut)}
.cmd kbd,.kbd{margin-left:auto;font:11px ui-monospace,monospace;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--mut);background:var(--pan2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--pan)}
.seg button{border:0;background:transparent;padding:6px 10px;font-size:12px;color:var(--mut)}
.seg button.on{background:var(--accbg);color:var(--acc2)}
.sel{height:34px;border-radius:10px;border:1px solid var(--line);background:var(--pan);padding:0 10px;font-size:13px}
.ibtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--pan);display:grid;place-items:center}
.ibtn:hover{border-color:var(--acc)}
/* main */
.main{overflow:auto;padding:calc(var(--pad) + 6px) calc(var(--pad) + 10px) 110px;position:relative}
.main.in>*{animation:rise .35s cubic-bezier(.2,.7,.2,1) both}
.main.in>*:nth-child(2){animation-delay:.04s}.main.in>*:nth-child(3){animation-delay:.08s}.main.in>*:nth-child(4){animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:1.75em;margin:0 0 4px;letter-spacing:-.02em;font-weight:680}
.sub{color:var(--mut);margin:0 0 calc(var(--gap) + 4px)}
.grid{display:grid;gap:var(--gap)}
.g6{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
@media(max-width:1000px){.g2{grid-template-columns:1fr}.shell{grid-template-columns:56px 1fr}.cmd span{display:none}}
.card{background:var(--pan);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);position:relative}
.card h3{margin:0 0 10px;font-size:.78em;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);font-weight:650;display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500}
.btn{border:1px solid var(--line);background:var(--pan2);border-radius:10px;padding:6px 12px;font-size:.92em;transition:.15s}
.btn:hover{border-color:var(--acc);background:var(--accbg)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:oklch(.15 .02 285);font-weight:620}
.btn.pri:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.4;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:3px 11px;font-size:12px;background:var(--pan);color:var(--mut)}
.chip.on{background:var(--accbg);border-color:var(--acc);color:var(--acc2)}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:600;border:1px solid transparent}
.b-ok{color:var(--ok);background:color-mix(in oklch,var(--ok) 14%,transparent)}.b-warn{color:var(--warn);background:color-mix(in oklch,var(--warn) 14%,transparent)}.b-bad{color:var(--bad);background:color-mix(in oklch,var(--bad) 14%,transparent)}.b-acc{color:var(--acc2);background:var(--accbg)}.b-n{color:var(--mut);background:var(--pan2)}
.up{color:var(--ok)}.dn{color:var(--bad)}.mut{color:var(--mut)}.dim{color:var(--dim)}
.row{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.sp{margin-left:auto}
/* kpi */
.kpi{text-align:left;background:var(--pan);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);transition:.2s;position:relative;overflow:hidden}
.kpi:hover{border-color:var(--acc);transform:translateY(-2px);box-shadow:var(--shadow)}
.kl{font-size:.8em;color:var(--mut)}.kvv{font-size:1.9em;font-weight:680;letter-spacing:-.02em;margin:2px 0}.kd{font-size:.82em}
.spark{display:block;margin-top:6px;width:140px;height:34px}
.kpi .why{position:absolute;right:10px;top:10px;font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:0 7px}
.kpi:hover .why{color:var(--acc2);border-color:var(--acc)}
/* feed */
.item{display:grid;grid-template-columns:10px 1fr auto;gap:12px;padding:14px 0;border-top:1px solid var(--line);transition:.35s}
.item:first-of-type{border-top:0}
.item.done{opacity:.4;filter:grayscale(1)}
.sev{width:10px;height:10px;border-radius:99px;margin-top:6px}
.sev.bad{background:var(--bad);box-shadow:0 0 0 4px color-mix(in oklch,var(--bad) 20%,transparent);animation:pl 2s infinite}
.sev.warn{background:var(--warn)}.sev.acc{background:var(--acc)}
@keyframes pl{50%{box-shadow:0 0 0 8px transparent}}
.it-t{font-weight:620}.it-s{color:var(--mut);font-size:.92em;margin:2px 0 8px}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.meter{width:110px;height:6px;border-radius:9px;background:var(--pan2);overflow:hidden}.meter i{display:block;height:100%;border-radius:9px}
.ro .acts .btn,.ro .btn.act{opacity:.35;pointer-events:none}
/* tables */
table{border-collapse:collapse;width:100%}
th{font-size:.74em;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);font-weight:600;position:sticky;top:0;background:var(--pan)}
td{padding:7px 10px;border-bottom:1px solid color-mix(in oklch,var(--line) 55%,transparent)}
td.n,th.n{text-align:right}
tbody tr{transition:.12s}tbody tr.clk{cursor:pointer}tbody tr.clk:hover{background:var(--accbg)}
input.in,textarea.in{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;outline:none}
input.in:focus,textarea.in:focus{border-color:var(--acc)}
/* dock */
.dock{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:14px;background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:18px;padding:9px 16px;box-shadow:var(--shadow);width:min(720px,calc(100vw - 120px))}
.dock input[type=range]{flex:1;accent-color:var(--acc)}
.dock .dl{font-size:12px;color:var(--mut);white-space:nowrap}.dock b{color:var(--tx)}
.banner{position:sticky;top:-8px;z-index:3;margin:-6px 0 14px;padding:9px 14px;border-radius:12px;background:color-mix(in oklch,var(--warn) 16%,var(--pan));border:1px solid color-mix(in oklch,var(--warn) 50%,transparent);display:flex;align-items:center;gap:12px;font-size:.92em}
/* side card */
.side{position:fixed;right:14px;top:70px;bottom:88px;width:410px;max-width:calc(100vw - 100px);background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);z-index:8;transform:translateX(120%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.side.open{transform:none}
.side header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.side header b{font-size:1.05em}.side .body{padding:14px 16px;overflow:auto;flex:1}
.lineage{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.lineage .ln{position:relative;padding:0 0 14px}.lineage .ln::before{content:"";position:absolute;left:-23px;top:5px;width:10px;height:10px;border-radius:9px;background:var(--acc);box-shadow:0 0 0 3px var(--bg2)}
pre.json{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:11.5px;overflow:auto;margin:6px 0}
/* palette */
.ov{position:fixed;inset:0;background:oklch(0 0 0/.5);backdrop-filter:blur(4px);z-index:30;display:none;align-items:flex-start;justify-content:center;padding-top:11vh}
.ov.open{display:flex}
.pal{width:min(880px,94vw);background:var(--pan);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;animation:rise .2s both}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:16px 20px;font-size:1.15em;outline:none}
.pal .cols{display:grid;grid-template-columns:1fr 1fr;min-height:320px;max-height:52vh}
.pal .list{overflow:auto;border-right:1px solid var(--line);padding:6px}
.pal .opt{padding:9px 12px;border-radius:10px;cursor:pointer;display:flex;gap:10px;align-items:center}
.pal .opt.sel{background:var(--accbg);box-shadow:inset 0 0 0 1px var(--acc)}
.pal .prev{padding:16px;overflow:auto}
.pal .foot{border-top:1px solid var(--line);padding:8px 16px;font-size:12px;color:var(--dim);display:flex;gap:14px}
@media(max-width:700px){.pal .cols{grid-template-columns:1fr}.pal .prev{display:none}}
/* toast */
#toasts{position:fixed;left:84px;bottom:84px;z-index:40;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--pan2);border:1px solid var(--acc);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;animation:rise .25s both;max-width:420px}
.toast button{border:0;background:transparent;color:var(--acc2);font-weight:650}
/* svg shared */
svg text{fill:var(--tx);font-family:inherit}
.axis{stroke:var(--line)}.lbl{fill:var(--dim)!important;font-size:11px}
/* strand */
.nd rect{fill:var(--pan2);stroke:var(--line);stroke-width:1;rx:10;transition:.2s}
.nd:hover rect{stroke:var(--acc)}.nd{cursor:pointer;transition:opacity .3s}
.nd.future rect{stroke-dasharray:4 3}.nd.dev rect{stroke:var(--warn)}
.nd.on rect{stroke:var(--acc);fill:var(--accbg);stroke-width:2}
.dim-all .nd:not(.on){opacity:.3}
.lk{fill:none;stroke:var(--dim);stroke-width:1.5;opacity:.6;transition:.3s}.lk.f{stroke:var(--acc);stroke-dasharray:5 4}
.dim-all .lk:not(.on){opacity:.1}.lk.on{stroke:var(--acc);opacity:1;stroke-width:2.4}
/* flow */
.fl{opacity:.32;transition:.2s}.fl:hover{opacity:.7}
svg[data-mode=cash] .fl[data-k=mat]{opacity:.06}svg[data-mode=mat] .fl[data-k=cash]{opacity:.06}
svg[data-mode=risk] .fl{opacity:.1}svg[data-mode=risk] .fl[data-r="1"]{opacity:.75}
.fnode text{paint-order:stroke;stroke:var(--pan);stroke-width:4px;stroke-linejoin:round}
.part{fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:1 18;opacity:.5;animation:fm 2.4s linear infinite;pointer-events:none}
@keyframes fm{to{stroke-dashoffset:-19}}
.fnode{cursor:pointer}.fnode.hot rect{animation:glow 1.8s infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 8px var(--bad))}}
/* floor */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px;margin-bottom:var(--gap)}
.tile{background:var(--pan);border:1px solid var(--line);border-radius:12px;padding:9px 11px;position:relative}
.tile .st{position:absolute;right:10px;top:10px;width:8px;height:8px;border-radius:9px}
.lane{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center;margin-bottom:8px}
.track{position:relative;height:46px;background:repeating-linear-gradient(90deg,transparent 0 89px,var(--line) 89px 90px),var(--bg2);border:1px solid var(--line);border-radius:10px;display:flex;overflow:hidden}
.track.tgt{outline:2px solid var(--acc);background-color:var(--accbg)}.track.bad{outline:2px solid var(--bad)}
.job{height:100%;border-right:1px solid var(--bg);background:linear-gradient(180deg,color-mix(in oklch,var(--c) 80%,transparent),color-mix(in oklch,var(--c) 55%,transparent));display:flex;flex-direction:column;justify-content:center;padding:0 7px;font-size:11px;cursor:grab;touch-action:none;user-select:none;flex:none;overflow:hidden;white-space:nowrap;color:#fff;position:relative}
.job.late{box-shadow:inset 0 -3px 0 var(--bad)}.job:active{cursor:grabbing}
.job small{opacity:.8}
.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.9;box-shadow:var(--shadow);border-radius:8px;height:46px}
/* promise */
.cols5{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:var(--gap);overflow-x:auto;padding-bottom:6px}
.col{background:var(--bg2);border:1px dashed var(--line);border-radius:var(--r);padding:10px;min-height:340px;transition:.15s}
.col.over{border-color:var(--acc);background:var(--accbg)}
.col h4{margin:0 0 8px;font-size:.85em;display:flex;gap:6px;align-items:baseline}
.pc{background:var(--pan);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;cursor:grab;transition:.15s}
.pc:hover{border-color:var(--acc);transform:translateY(-1px)}.pc.drag{opacity:.4}
.band{position:relative;height:7px;background:var(--pan2);border-radius:9px;margin:6px 0 3px}
.band i{position:absolute;top:0;bottom:0;border-radius:9px}
/* policy */
.ed{position:relative;height:210px;background:var(--bg2);border:1px solid var(--line);border-radius:12px}
.ed pre,.ed textarea{position:absolute;inset:0;margin:0;padding:12px 14px;font:12.5px/1.65 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word;border:0;overflow:auto;tab-size:2}
.ed textarea{background:transparent;color:transparent;caret-color:var(--tx);resize:none;outline:none;width:100%}
.ed pre{pointer-events:none}.k1{color:var(--acc2)}.k2{color:var(--warn)}.k3{color:var(--ok)}.k4{color:var(--dim)}
.bars{display:flex;align-items:flex-end;gap:3px;height:90px}
.bars i{flex:1;background:var(--acc);border-radius:3px 3px 0 0;opacity:.85;min-height:2px}
/* misc */
.ticker{font:12px ui-monospace,monospace;height:300px;overflow:hidden;display:flex;flex-direction:column-reverse}
.ticker div{padding:4px 0;border-bottom:1px solid color-mix(in oklch,var(--line) 50%,transparent);animation:rise .3s both;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gauge{height:8px;background:var(--pan2);border-radius:9px;overflow:hidden}.gauge i{display:block;height:100%;background:var(--ok);transition:width .6s}
.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--pan2) 0);display:grid;place-items:center;transition:.6s}
.ring::after{content:attr(data-l);width:74px;height:74px;border-radius:50%;background:var(--pan);display:grid;place-items:center;font-weight:680;font-size:1.2em}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.stack{display:flex;height:22px;border-radius:8px;overflow:hidden}.stack i{display:block;height:100%}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <nav class="rail" id="rail"></nav>
  <header class="top">
    <div class="crumb" id="crumb"></div>
    <button class="cmd" id="cmdbtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Ask or command… “what if ACME slips 2 weeks”</span><kbd>⌘K</kbd></button>
    <select class="sel" id="role" title="Role workspace"></select>
    <div class="seg" id="dens"><button data-d="calm">Calm</button><button data-d="standard" class="on">Std</button><button data-d="dense">Dense</button></div>
    <button class="ibtn" id="theme" title="Theme">◐</button>
  </header>
  <main class="main in" id="main"></main>
</div>
<aside class="side" id="side"><header><button class="btn" id="back" style="display:none">←</button><b id="stitle"></b><span class="dim" id="ssub"></span><button class="btn sp" id="sclose">✕</button></header><div class="body" id="sbody"></div></aside>
<div class="dock" id="dock"><span class="dl">⏱ <b>Time</b></span><input type="range" id="scrub" min="-29" max="0" step="1" value="0"><span class="dl" id="scrubl"></span><button class="btn" id="now">Now</button></div>
<div class="ov" id="ov"><div class="pal"><input id="pin" placeholder="Type a command or question…" autocomplete="off"><div class="cols"><div class="list" id="plist"></div><div class="prev" id="pprev"></div></div><div class="foot"><span>↑↓ navigate</span><span>↵ run</span><span>esc close</span><span class="sp">The assistant only <b>proposes</b> typed commands · kernel validates · you confirm</span></div></div></div>
<div id="toasts"></div>

<script>
/* ======================= helpers ======================= */
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const fmt=n=>Math.round(n).toLocaleString('en-US');
const eur=n=>{const a=Math.abs(n),s=n<0?'−':'';return s+'€'+(a>=1e6?(a/1e6).toFixed(2)+'M':a>=1e3?Math.round(a/1e3)+'k':Math.round(a))};
const TODAY=new Date(2026,10,10),dOf=o=>new Date(TODAY.getTime()+o*864e5);
const fD=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const fDW=d=>d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

<div class="grid g2"><div class="card"><h3>October close <span class="r">${done}/${TASKS.length} tasks</span></h3><div class="row" style="align-items:flex-start;gap:24px"><div class="ring" id="rg" data-l="${Math.round(done/TASKS.length*100)}%" style="--p:${done/TASKS.length*100}"></div><div style="flex:1">${TASKS.map((t,i)=>`<div class="row" style="padding:6px 0;border-top:1px solid var(--line)"><span class="badge ${t[1]?'b-ok':'b-n'}" id="tb${i}">${t[1]?'✓ done':'todo'}</span><span class="${t[1]?'mut':''}">${t[0]}</span>${t[1]?'':`<button class="btn sp act" data-r="${i}">Run</button>`}</div>`).join('')}</div></div></div>
<div class="grid" style="align-content:start"><div class="card"><h3>Books ↔ Flow reconciliation</h3><table><tbody><tr><td>GL inventory (1300+1350+1400)</td><td class="n num">${fmt(gl)}</td></tr><tr><td>Stock projection × cost</td><td class="n num">${fmt(sub)}</td></tr><tr><td><b>Difference</b></td><td class="n num"><b class="up">${fmt(gl-sub)}.00</b></td></tr></tbody></table><div class="badge ${gl===sub?'b-ok':'b-bad'}" style="margin-top:8px">${gl===sub?'✓ Reconciled by construction':'✗ Investigate'}</div></div>
<div class="card"><h3>Receivables ageing</h3><div class="stack">${AGE.map(a=>`<i style="width:${a[1]/997*100}%;background:${a[2]}" title="${a[0]} d"></i>`).join('')}</div>${AGE.map(a=>`<div class="row" style="padding:3px 0"><i style="width:10px;height:10px;border-radius:3px;background:${a[2]}"></i>${a[0]} d<span class="sp num">€${a[1]}k</span></div>`).join('')}</div></div></div>
<div class="card" style="margin-top:var(--gap)"><h3>3-way match exceptions <span class="r dim">PO · receipt · invoice</span></h3><table><thead><tr><th>Doc</th><th>Supplier</th><th class="n">Variance</th><th>Policy</th><th></th></tr></thead><tbody>${[['INV-5530','Nordwerk',4.2,'approval.match ≤ 2%'],['INV-5518','Boreal Polymers',1.1,'auto-accept'],['INV-5509','ACME Steel',6.8,'approval.match ≤ 2%'],['INV-5502','Tessa Bearings',0.4,'auto-accept']].map(r=>`<tr><td class="mono">${r[0]}</td><td>${r[1]}</td><td class="n num">${r[2]}%</td><td><span class="badge ${r[2]>2?'b-warn':'b-ok'}">${r[3]}</span></td><td class="n"><button class="btn act" data-x="${r[0]}">${r[2]>2?'Request credit note':'Accept'}</button></td></tr>`).join('')}</tbody></table></div>`;
$$('[data-r]',el).forEach(b=>b.onclick=()=>{const i=+b.dataset.r;if(TASKS.slice(0,i).some(t=>!t[1]))return toast('Run earlier tasks first');b.disabled=true;b.textContent='Running…';let p=done/TASKS.length*100;const tg=(i+1)/TASKS.length*100;const iv=setInterval(()=>{p+=2;$('#rg',el)&&$('#rg',el).style.setProperty('--p',Math.min(p,tg));if(p>=tg){clearInterval(iv);TASKS[i][1]=1;if(S.view==='money')rerender();toast('✓ '+TASKS[i][0])}},30)});
$$('[data-x]',el).forEach(b=>b.onclick=()=>{b.closest('tr').style.opacity=.4;b.disabled=true;toast(`${b.dataset.x}: correction event emitted`)})};

/* ---- Spine ---- */
VR.spine=el=>{const PR=[['inventory',12],['gl',18],['ar_ap',9],['wip_cost',31],['kpi',22],['search',44]];let seq=482193;
el.innerHTML=banner()+`<h1>Spine</h1><p class="sub">The kernel: one append-only ledger, invariants enforced inside the database, and projectors that can be rebuilt from zero. This is what makes everything above trustworthy.</p>
<div class="grid g2"><div class="card"><h3>Live ledger stream <span class="r"><span class="badge b-ok">● writing</span></span></h3><div class="ticker" id="tk"></div></div>
<div class="grid" style="align-content:start"><div class="card"><h3>Projectors <span class="r dim">lag SLO &lt; 1 s</span></h3>${PR.map((p,i)=>`<div style="margin-bottom:9px"><div class="row" style="font-size:.9em"><b class="mono">${p[0]}</b><span class="sp num dim" id="lg${i}">${p[1]} ms</span><button class="btn" data-rb="${i}" style="padding:1px 8px;font-size:11px">rebuild</button></div><div class="gauge"><i id="gg${i}" style="width:${p[1]}%"></i></div></div>`).join('')}</div>
<div class="card"><h3>Invariants enforced in-DB</h3>${[['Legs balance per axis','12,48'+'1,204 checks'],['Fulfilment ≤ commitment','2,310,562'],['Closed periods immutable','49 periods'],['Hash chain unbroken','seq 0 → '+fmt(seq)]].map(a=>`<div class="row" style="padding:5px 0;border-top:1px solid var(--line)"><span class="badge b-ok">✓</span>${a[0]}<span class="sp dim num">${a[1]}</span></div>`).join('')}</div></div></div>
<div class="card" style="margin-top:var(--gap)"><h3>Architecture at a glance</h3><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">${[['Experience','Atelier · Floor PWA · Pocket · API'],['Edge','OIDC · RBAC+ABAC · SoD'],['Modules','Catalog Parties Order Flow Make Money People Assets Quality Insight'],['Ledger kernel','events · commitments · fulfilments'],['Projectors','inventory · GL · AR/AP · KPI'],['PostgreSQL','RLS · bitemporal · PITR']].map((a,i)=>`<div style="border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:10px;padding:10px;background:var(--bg2)"><b>${a[0]}</b><div class="dim" style="font-size:.85em">${a[1]}</div></div>`).join('')}</div></div>`;
const tk=$('#tk',el),K=['goods.issued','po.received','invoice.posted','cash.received','wo.completed','goods.shipped'];let ph='a91c4e02';
const add=()=>{const k=K[Math.floor(Math.random()*K.length)],a=Math.round(Math.random()*90+4)*100,h=fnv(ph+seq+k+a);const d=document.createElement('div');d.innerHTML=`<span class="dim">${new Date().toLocaleTimeString('en-GB')}</span> <span style="color:var(--acc2)">#${++seq}</span> ${k.padEnd(14)} <span class="num">${fmt(a)}</span> <span class="dim">${ph}→${h}</span>`;ph=h;tk.prepend(d);while(tk.children.length>14)tk.lastChild.remove();PR.forEach((p,i)=>{p[1]=clamp(p[1]+(Math.random()-.5)*8,4,70);const l=$('#lg'+i,el),g=$('#gg'+i,el);if(l){l.textContent=Math.round(p[1])+' ms';g.style.width=p[1]+'%'}})};
for(let i=0;i<8;i++)add();S.timer=setInterval(add,1300);
$$('[data-rb]',el).forEach(b=>b.onclick=()=>{const i=+b.dataset.rb,g=$('#gg'+i,el);b.disabled=true;let p=0;const iv=setInterval(()=>{p+=7;if(p>=100){clearInterval(iv);b.disabled=false;toast(`<b>${PR[i][0]}</b> rebuilt from seq 0 · hash matches production ✓`)}},60)})};

/* ======================= palette ======================= */
const CMDS=[...VIEWS.map(v=>({t:'Go to '+v[1],k:v[1].toLowerCase()+' '+v[2].toLowerCase(),run:()=>go(v[0]),pv:()=>`<b>Navigate</b><p class="mut">${v[2]}</p>`})),
{t:'ship SO-2231 partial (480 pcs)',k:'ship shipment so-2231 partial deliver',pv:()=>cmdPv('goods.ship',{so:'SO-2231',line:1,qty:480,mode:'partial'},['Creates event goods.shipped at valid_at=now','Fulfils 60% of SO-2231/1 and keeps 40% open','Drafts INV-5531 (€86k) and updates Promise Board'],'Plan is deterministic: nothing posted until you confirm.'),run:()=>toast('Shipped 480 pcs · INV-5531 drafted · seq '+fmt(482194),()=>{})},
{t:'what if supplier ACME slips 2 weeks',k:'what if scenario supplier acme slips delay',pv:()=>cmdPv('scenario.fork',{base_seq:482193,change:{supplier:'ACME',delay_weeks:2}},['Forks the ledger (copy-on-write)','Re-runs MRP + promise engine on the overlay','Shows cash, service and margin deltas'],'Production remains untouched.'),run:()=>go('scenario',{scen:0,sp:[2,4,5]})},
{t:'what if machine M3 is down 5 days',k:'what if machine m3 down breakdown scenario',pv:()=>cmdPv('scenario.fork',{base_seq:482193,change:{machine:'M3',down_days:5}},['Forks the ledger','Re-solves finite-capacity schedule'],'Production remains untouched.'),run:()=>go('scenario',{scen:2,sp:[2,4,5]})},
{t:'recall lot L-7781',k:'recall lot l-7781 genealogy trace quarantine',pv:()=>cmdPv('trace.forward',{lot:'L-7781'},['Walks the Strand forward from GRN-771','Finds 2 work orders, 2 shipments, 320 pcs','Offers customer notice draft'],'Read-only.'),run:()=>go('strand',{strand:'lot7781',trace:'fwd',hl:new Set()})},
{t:'approve PO-8821 (€48,200)',k:'approve po-8821 purchase boreal',pv:()=>cmdPv('approval.grant',{doc:'PO-8821',level:2,amount:48200},['Emits approval event signed by you','PO moves to Commitment: open','Decision logged with policy approval.po v14'],'Requires your L2 authority.'),run:()=>{S.resolved.add('p5');toast('Approved PO-8821 · emitted approval.granted')}},
{t:'margin by customer last quarter',k:'margin customer quarter report analytics',pv:()=>`<b>Gross margin · Q3 (derived from Strands)</b>${[['Kestrel Aero',38.2],['Helio Drives',34.6],['Apex Robotics',30.1],['Nordwerk GmbH',27.9],['Brightline OEM',24.3]].map(r=>`<div class="row" style="margin:8px 0"><span style="width:110px">${r[0]}</span><div class="meter" style="flex:1;width:auto"><i style="width:${r[1]*2.3}%;background:var(--acc)"></i></div><span class="num">${r[1]}%</span></div>`).join('')}<div class="dim">Every bar is traceable to events.</div>`,run:()=>go('ledger',{ltab:'tb'})},
{t:'close period October',k:'close period month end october',pv:()=>cmdPv('period.close',{period:'2026-10'},['Runs remaining 5 close tasks','Locks period; later changes become restatements'],'Needs Controller role.'),run:()=>go('money')},
{t:'toggle theme',k:'theme dark light mode',run:()=>$('#theme').click(),pv:()=>'<b>Switch light/dark</b>'},{t:'density: dense',k:'density dense compact',run:()=>setDens('dense'),pv:()=>'<b>Compact layout for planners</b>'},{t:'density: calm',k:'density calm spacious',run:()=>setDens('calm'),pv:()=>'<b>Spacious layout for executives</b>'}];
function cmdPv(type,args,fx,note){return`<span class="badge b-acc">proposed command</span><pre class="json">${esc(JSON.stringify({type,args,idempotency_key:'cmd_'+fnv(type+JSON.stringify(args))},null,1))}</pre><div class="dim" style="font-size:.8em">EFFECTS</div>${fx.map(f=>`<div>• ${f}</div>`).join('')}<p class="dim" style="font-size:.85em">${note}</p>`}
let psel=0,pres=[];
function pal(){const q=$('#pin').value.trim().toLowerCase();pres=CMDS.filter(c=>q.split(/\s+/).every(w=>(c.t+' '+c.k).toLowerCase().includes(w)));if(q&&!pres.length)pres=[{t:'Search ledger for “'+q+'”',run:()=>go('ledger',{ltab:'events',lq:q}),pv:()=>`<b>No exact command.</b><p class="mut">Interpreting as a ledger search. The assistant never invents actions; unknown phrases fall back to read-only search.</p>`}];psel=Math.min(psel,pres.length-1);$('#plist').innerHTML=pres.map((c,i)=>`<div class="opt ${i===psel?'sel':''}" data-i="${i}">${c.t}</div>`).join('');$('#pprev').innerHTML=pres[psel]?pres[psel].pv()+`<div style="margin-top:14px"><button class="btn pri" id="pc">Confirm &amp; run ↵</button></div>`:'';$$('.opt').forEach(o=>{o.onclick=()=>{psel=+o.dataset.i;pal()};o.ondblclick=run});const b=$('#pc');b&&(b.onclick=run)}
function run(){const c=pres[psel];if(!c)return;closePal();c.run()}
function openPal(){$('#ov').classList.add('open');$('#pin').value='';psel=0;pal();$('#pin').focus()}
function closePal(){$('#ov').classList.remove('open')}
$('#cmdbtn').onclick=openPal;$('#ov').onclick=e=>{if(e.target.id==='ov')closePal()};$('#pin').oninput=()=>{psel=0;pal()};
document.addEventListener('keydown',e=>{const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#ov').classList.contains('open')?closePal():openPal();return}
if($('#ov').classList.contains('open')){if(e.key==='Escape')closePal();else if(e.key==='ArrowDown'){e.preventDefault();psel=Math.min(pres.length-1,psel+1);pal()}else if(e.key==='ArrowUp'){e.preventDefault();psel=Math.max(0,psel-1);pal()}else if(e.key==='Enter'){e.preventDefault();run()}return}
if(e.key==='Escape'){S.cards=[];drawCard()}if(!typing&&!e.metaKey&&!e.ctrlKey&&/^[0-9]$/.test(e.key)){const v=VIEWS[(+e.key+9)%10];v&&go(v[0])}});

/* ======================= chrome ======================= */
$('#role').innerHTML=Object.entries(ROLES).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('');
$('#role').onchange=e=>{S.role=e.target.value;buildRail();toast(`Workspace: <b>${ROLES[S.role].n}</b> · surfaces re-ranked`);rerender()};
function setDens(d){document.documentElement.dataset.density=d;$$('#dens button').forEach(b=>b.classList.toggle('on',b.dataset.d===d))}
$$('#dens button').forEach(b=>b.onclick=()=>setDens(b.dataset.d));
$('#theme').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';if(S.view==='flow'||S.view==='scenario')rerender()};
scrubL();
const h=location.hash.slice(1);go(VIEWS.some(v=>v[0]===h)?h:'pulse');
</script>
